<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 735" role="img" aria-labelledby="title desc"><title id="title">From curiosity to hands-on learning</title><desc id="desc">Two entry points, one connected learning experience.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c2d"/><stop offset="1" stop-color="#203247"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#8aa9c8"/></marker></defs><rect width="1000" height="735" rx="26" fill="url(#bg)"/>
