<path d="M740 757 V782 H500 V808" fill="none" stroke="#8aa9c8" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arr)"/>
<rect x="40" y="810" width="920" height="91" rx="16" fill="#23564f" stroke="#47617e" stroke-width="1.5"/>
<text x="500.0" y="852.0" fill="#f3f7ff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle" letter-spacing="0">Generation and persistence</text>
<text x="500.0" y="879.0" fill="#c0d0e3" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" letter-spacing="0">Individual meshes · textures · materials · GLB</text>
<path d="M500 901 V925" fill="none" stroke="#8aa9c8" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arr)"/>
<rect x="40" y="927" width="920" height="105" rx="16" fill="#284a70" stroke="#47617e" stroke-width="1.5"/>
<text x="500.0" y="964.5" fill="#f3f7ff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle" letter-spacing="0">Interactive educational representation</text>
<text x="500.0" y="991.5" fill="#c0d0e3" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" letter-spacing="0">Rotation · manual zoom · selection · ES/EN cards</text>
<text x="500.0" y="1014.5" fill="#c0d0e3" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" letter-spacing="0">Volumes and surfaces can coexist</text>
<text x="36" y="1077" fill="#c0d0e3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start" letter-spacing="0">Educational reconstruction is not manufacturing CAD.</text>
</svg>