<rect x="40" y="251" width="920" height="90" rx="16" fill="#284a70" stroke="#47617e" stroke-width="1.5"/>
<text x="500.0" y="292.5" fill="#f3f7ff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle" letter-spacing="0">Gemini: multimodal interpretation</text>
<text x="500.0" y="319.5" fill="#c0d0e3" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" letter-spacing="0">Regions, shapes, proposed identity and bilingual cards</text>
<path d="M500 341 V364" fill="none" stroke="#8aa9c8" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arr)"/>
<rect x="40" y="366" width="920" height="90" rx="16" fill="#23564f" stroke="#47617e" stroke-width="1.5"/>
<text x="500.0" y="407.5" fill="#f3f7ff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle" letter-spacing="0">Custom algorithms: geometry</text>
<text x="500.0" y="434.5" fill="#c0d0e3" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" letter-spacing="0">Validate polygons · rectify · scale to physical dimensions</text>
<path d="M500 456 V479" fill="none" stroke="#8aa9c8" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arr)"/>
<rect x="170" y="481" width="660" height="78" rx="16" fill="#1e3045" stroke="#47617e" stroke-width="1.5"/>
<text x="500.0" y="516.5" fill="#f3f7ff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle" letter-spacing="0">Supported height for this part?</text>
<text x="500.0" y="543.5" fill="#c0d0e3" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" letter-spacing="0">Check independent evidence</text>
