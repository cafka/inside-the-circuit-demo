<text x="260" y="576" fill="#eac46e" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0">Yes</text>
<path d="M500 583 H740 V610" fill="none" stroke="#8aa9c8" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arr)"/>
<text x="740" y="576" fill="#eac46e" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0">No</text>
<rect x="40" y="612" width="440" height="145" rx="16" fill="#23564f" stroke="#47617e" stroke-width="1.5"/>
<text x="260.0" y="658.0" fill="#f3f7ff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle" letter-spacing="0">Generate volume</text>
<text x="260.0" y="685.0" fill="#c0d0e3" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" letter-spacing="0">Envelope extrusion</text>
<text x="260.0" y="708.0" fill="#c0d0e3" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" letter-spacing="0">Documented or measured dimensions</text>
<text x="260.0" y="731.0" fill="#c0d0e3" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" letter-spacing="0">End-to-end validation pending</text>
<rect x="520" y="612" width="440" height="145" rx="16" fill="#1e3045" stroke="#aa8953" stroke-width="1.5"/>
<text x="740.0" y="658.0" fill="#f3f7ff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle" letter-spacing="0">Retain surface</text>
<text x="740.0" y="685.0" fill="#c0d0e3" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" letter-spacing="0">Texture and selectable region</text>
<text x="740.0" y="708.0" fill="#c0d0e3" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" letter-spacing="0">Illustrative relief, not measured</text>
<text x="740.0" y="731.0" fill="#c0d0e3" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" letter-spacing="0">Motor 2040: 13 regions</text>
